<!DOCTYPE html>
<html>

<head>
    <title>Registered Users</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            zoom: 1.0;
            font-size: 35px;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 85px;
            margin-bottom: 15px;
            font-weight: 900;
        }

        .header p {
            font-size: 40px;
            opacity: 0.9;
        }

        .container {
            width: 95%;
            max-width: 1600px;
            margin: 40px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            padding: 25px 50px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 45px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        .table-box {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 35px;
            text-align: left;
            font-size: 40px;
            font-weight: 900;
        }

        td {
            padding: 35px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 35px;
            font-weight: bold;
        }

        tr:hover {
            background: #eff6ff;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            padding: 18px 35px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.3);
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .count-box {
            background: white;
            padding: 40px 60px;
            border-radius: 25px;
            margin-bottom: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            font-size: 55px;
            font-weight: 900;
            color: #1e3a8a;
            border: 2px solid #bfdbfe;
        }
    </style>

</head>

<body>

    <div class="header">
        <h1>👥 Registered Users</h1>
        <p>Smart Music Player Admin Panel</p>
    </div>

    <div class="container">

        <div class="top-bar">
            <div class="count-box">
                Total Users: {{ users|length }}
            </div>

            <a href="/admin-dashboard" class="back-btn">
                ⬅ Back Dashboard
            </a>
        </div>

        <div class="table-box">

            <table>

                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Action</th>
                </tr>

                {% for user in users %}
                <tr>

                    <td>{{ user[0] }}</td>

                    <td>{{ user[1] }}</td>

                    <td>
                        <a href="/delete-user/{{ user[0] }}" class="delete-btn">
                            Delete
                        </a>
                    </td>

                </tr>
                {% endfor %}

            </table>

        </div>

    </div>

</body>

</html>
