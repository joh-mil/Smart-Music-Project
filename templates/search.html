<!DOCTYPE html>
<html>
<head>
    <title>Search Songs</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 35px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #22c55e;
            border-radius: 12px;
            background: #111827;
            color: white;
            margin: 20px auto;
            display: block;
        }

        .search-box:focus {
            outline: none;
            box-shadow: 0 0 15px #22c55e;
        }

        button {
            padding: 12px 25px;
            margin: 6px;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: black;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #16a34a;
        }

        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .song-card {
            background: #1e293b;
            padding: 18px;
            border-radius: 18px;
            transition: 0.25s;
        }

        .song-card:hover {
            background: #334155;
            transform: translateY(-5px);
        }

        .cover {
            width: 100%;
            height: 155px;
            background: linear-gradient(135deg, #020617, #22c55e);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 58px;
            margin-bottom: 12px;
        }

        .song-card h3 {
            margin: 12px 0 5px 0;
        }

        .song-card p {
            color: #cbd5e1;
            margin: 5px 0;
        }

        .no-results {
            color: #94a3b8;
            font-size: 18px;
            margin: 40px 0;
        }

        a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🔍 Search Songs</h1>

    <div class="card">
        <form method="GET" action="/search">
            <input 
                type="text" 
                name="q" 
                class="search-box" 
                placeholder="Search by song name, artist, genre, or mood..." 
                value="{{ query }}"
                required
            >
            <button type="submit">Search</button>
        </form>
    </div>

    {% if query %}
        {% if results %}
            <h2>Results for "{{ query }}"</h2>
            <div class="song-grid">
                {% for song in results %}
                <div class="song-card">
                    <div class="cover">🎧</div>

                    <h3>{{ song.song_name }}</h3>
                    <p>{{ song.singer }}</p>
                    <p>{{ song.genre }} / {{ song.mood }}</p>

                    <button onclick="playSong('{{ song.filename }}')">▶ Play</button>

                    <a href="/karaoke/{{ song.filename }}">
                        <button>🎤 Karaoke</button>
                    </a>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="no-results">
                <p>No songs found for "{{ query }}"</p>
            </div>
        {% endif %}
    {% endif %}

    <br>
    <a href="/">⬅ Back to Home</a>
</div>

<script>
function playSong(filename) {
    window.location.href = "/";
    setTimeout(() => {
        let player = document.getElementById("player");
        if (player) {
            player.src = "/static/songs/" + filename;
            player.load();
            player.play();
        }
    }, 100);
}
</script>

</body>
</html>
