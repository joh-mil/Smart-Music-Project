<!DOCTYPE html>
<html>
<head>
    <title>Train AI Model</title>
    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f1f5f9;
            zoom: 1.0;
            font-size: 45px;
        }

        .header{
            background:#0f172a;
            color:white;
            padding:40px;
            text-align:center;
        }

        .header h1 {
            font-size: 110px;
            margin-bottom: 20px;
            font-weight: 900;
        }

        .header p {
            font-size: 55px;
            opacity: 0.9;
            font-weight: 600;
        }

        .container{
            width:95%;
            max-width:1600px;
            margin:40px auto;
            text-align: center;
        }

        .top-bar{
            display:flex;
            justify-content:flex-start;
            margin-bottom:20px;
        }

        .back-btn{
            background:#2563eb;
            color:white;
            padding:35px 70px;
            border-radius:30px;
            text-decoration:none;
            font-weight:900;
            font-size: 60px;
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.45);
        }

        .back-btn:hover{
            background:#1d4ed8;
        }

        .info-box{
            background:white;
            padding:80px;
            border-radius:35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            max-width: 1200px;
            margin: 60px auto;
            border: 2px solid #e2e8f0;
        }

        .info-box p {
            font-size: 60px;
            color: #0f172a;
            margin-bottom: 60px;
            font-weight: 800;
            line-height: 1.3;
        }

        .train-btn{
            background:linear-gradient(135deg, #9333ea, #7e22ce);
            color:white;
            padding:45px 120px;
            border: none;
            border-radius:35px;
            font-size:80px;
            font-weight:900;
            cursor:pointer;
            transition: 0.3s;
            box-shadow: 0 25px 55px rgba(147, 51, 234, 0.55);
        }

        .train-btn:hover{
            background:#7e22ce;
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🤖 Train AI Model</h1>
    <p>Smart Music Player Admin Panel</p>
</div>

<div class="container">

    <div class="top-bar">
        <a href="/admin-dashboard" class="back-btn">
            ⬅ Back Dashboard
        </a>
    </div>

    <div class="info-box">
        <p>This feature will train your AI model using the uploaded dataset for mood and genre prediction.</p>
        
        <form method="POST">
            <button type="submit" class="train-btn">🚀 Start Training Now</button>
        </form>
    </div>

</div>

</body>
</html>
