<!DOCTYPE html>
<html>
<head>
    <title>Smart Music Player</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e40af);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 120px;
            border-radius: 50px;
            width: 1200px;
            box-shadow: 0 0 80px rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 200px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 120px;
            margin: 20px 0;
            font-weight: 800;
            letter-spacing: -2px;
        }

        p {
            font-size: 60px;
            color: #cbd5f5;
            margin-bottom: 80px;
            font-weight: 500;
        }

        .container a {
            display: block;
            margin: 40px auto;
            width: 85%;
            padding: 50px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 70px;
            transition: all 0.3s ease;
        }

        .back-btn {
            position: absolute;
            bottom: 40px;
            left: 50px;
            padding: 50px 100px;
            font-size: 80px;
            font-weight: bold;
            background: #ef4444;
            color: white;
            border-radius: 100px;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #dc2626;
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
        }

        .register {
            background: #3b82f6;
            color: white;
        }

        .register:hover {
            background: #2563eb;
        }

        .login {
            background: #22c55e;
            color: white;
        }

        .login:hover {
            background: #16a34a;
        }

        .admin {
            margin-top: 40px;
            font-size: 30px;
            color: #94a3b8;
        }

        .admin a {
            color: #94a3b8;
            font-size: 30px;
            padding: 10px;
        }
        .admin-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            padding: 15px 30px;
            font-size: 30px;
            font-weight: bold;
            background: #9333ea;
            color: white;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: #7e22ce;
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>

<a href="/admin-login" class="admin-btn">Admin Login</a>
<a href="/abstract" class="back-btn">Previous Page</a>

<div class="container">
    <div class="logo">🎧</div>

    <h1>Smart Music Player</h1>
    <p>AI Powered Music Experience</p>

    <a href="/register" class="register">Create Account</a>
    <a href="/login" class="login">Login</a>

    
</div>

</body>
</html>
