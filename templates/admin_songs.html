<!DOCTYPE html>
<html>

<head>
    <title>Manage Songs</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            zoom: 1.0;
            font-size: 40px;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 100px;
            margin-bottom: 20px;
            font-weight: 900;
        }

        .header p {
            font-size: 50px;
            opacity: 0.9;
            font-weight: 600;
        }

        .container {
            width: 95%;
            max-width: 1600px;
            margin: 40px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            padding: 30px 60px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 900;
            font-size: 55px;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.4);
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        .table-box {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 35px;
            text-align: left;
            font-size: 40px;
            font-weight: 900;
        }

        td {
            padding: 35px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 35px;
            font-weight: bold;
        }

        tr:hover {
            background: #eff6ff;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 28px;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.3);
        }

        .delete-btn:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🎵 Manage Songs</h1>
        <p>Smart Music Player Admin Panel</p>
    </div>

    <div class="container">

        <div class="top-bar">
            <a href="/admin-dashboard" class="back-btn">
                ⬅ Back Dashboard
            </a>
        </div>

        <div class="table-box">
            <table>
                <tr>
                    <th>Song Name</th>
                    <th>Singer</th>
                    <th>Genre</th>
                    <th>Mood</th>
                    <th>Action</th>
                </tr>

                {% for song in songs %}
                <tr>
                    <td>{{ song.song_name }}</td>
                    <td>{{ song.singer }}</td>
                    <td>{{ song.genre }}</td>
                    <td>{{ song.mood }}</td>
                    <td>
                        <a href="{{ url_for('delete_song', filename=song['filename']) }}" class="delete-btn"
                            onclick="return confirm('Are you sure?')">
                            Delete
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>

</body>

</html>
